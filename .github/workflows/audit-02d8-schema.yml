name: 02D evidence schema audit

on:
  push:
    branches:
      - baseline-no-structures
    paths:
      - ".github/workflows/audit-02d8-schema.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  schema-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Download NATURAL artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37963092869
          pattern: NATURAL-E0560000-N7690000-QA-*
          path: audit/NATURAL
          merge-multiple: true

      - name: Download MODERATE artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37966257767
          pattern: MODERATE-E0510000-N7620000-QA-*
          path: audit/MODERATE
          merge-multiple: true

      - name: Download HIGH artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37969947850
          pattern: TEST_SULKU_11-QA-*
          path: audit/HIGH
          merge-multiple: true

      - name: Compare 02D.8 schemas and invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, pathlib

          roots = {
              "NATURAL": pathlib.Path("audit/NATURAL"),
              "MODERATE": pathlib.Path("audit/MODERATE"),
              "HIGH": pathlib.Path("audit/HIGH"),
          }

          schemas = {}
          rows_by_level = {}
          required = {
              "outlet_selection",
          }

          for label, root in roots.items():
              matches = list(root.rglob("02D8_final_spill_evidence.csv"))
              if len(matches) != 1:
                  raise SystemExit(f"{label}: expected exactly one 02D8_final_spill_evidence.csv, found {len(matches)}")
              p = matches[0]
              with p.open(newline="", encoding="utf-8-sig") as f:
                  reader = csv.DictReader(f)
                  fieldnames = reader.fieldnames or []
                  rows = list(reader)

              if not rows:
                  raise SystemExit(f"{label}: evidence table is empty")
              missing = sorted(required.difference(fieldnames))
              if missing:
                  raise SystemExit(f"{label}: missing required columns {missing}")

              vals = {r["outlet_selection"] for r in rows}
              if vals != {"UNASSIGNED"}:
                  raise SystemExit(f"{label}: outlet_selection values are {sorted(vals)}")

              schemas[label] = tuple(fieldnames)
              rows_by_level[label] = len(rows)

          reference = schemas["NATURAL"]
          for label, schema in schemas.items():
              if schema != reference:
                  raise SystemExit(
                      f"{label}: 02D.8 schema differs from NATURAL\n"
                      f"NATURAL={reference}\n{label}={schema}"
                  )

          with open("EVIDENCE_SCHEMA_AUDIT.txt", "w", encoding="utf-8") as f:
              f.write("02D.8 evidence schema audit: PASS\n")
              f.write("Schemas identical across NATURAL, MODERATE and HIGH.\n")
              f.write("outlet_selection=UNASSIGNED across all audited rows.\n")
              f.write("No outlet selection or routing choice inferred by this audit.\n")
              for label in ("NATURAL", "MODERATE", "HIGH"):
                  f.write(f"{label}: rows={rows_by_level[label]}\n")
          PY

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: 02d8-evidence-schema-audit-${{ github.sha }}
          retention-days: 30
          path: EVIDENCE_SCHEMA_AUDIT.txt
