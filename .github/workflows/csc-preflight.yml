name: CSC preflight

on:
  pull_request:
    branches:
      - baseline-no-structures
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: csc-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: CSC preflight / validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Prepare isolated Python 3.12
        run: |
          /usr/bin/python3.12 --version
          /usr/bin/python3.12 -I -B -m venv "$RUNNER_TEMP/csc-preflight-venv"
          printf '%s\n' "$RUNNER_TEMP/csc-preflight-venv/bin" >> "$GITHUB_PATH"

      - name: Install hash-locked validation dependencies
        run: |
          python3 -I -B -m pip --isolated install --require-hashes --only-binary=:all: --no-input --disable-pip-version-check --retries 0 --timeout 30 --requirement automation/csc/requirements-preflight.lock

      - name: Validate schema definitions
        run: python3 -I -B automation/csc/validate_manifest.py --schemas-only

      - name: Run isolated preflight tests
        run: python3 -I -B automation/csc/tests/run_tests.py
