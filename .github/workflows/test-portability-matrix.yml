name: Cross-platform portability QA

on:
  push:
    branches:
      - baseline-no-structures
    paths:
      - ".github/workflows/test-portability-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"

      - name: Parse project R scripts
        shell: Rscript {0}
        run: |
          files <- sort(unique(c(
            list.files("R", pattern = "\\.R$", recursive = TRUE, full.names = TRUE),
            list.files("tests", pattern = "\\.R$", recursive = TRUE, full.names = TRUE)
          )))
          stopifnot(length(files) > 0)
          for (f in files) {
            cat("Parsing:", f, "\n")
            parse(file = f)
          }
          cat("Parsed", length(files), "R scripts successfully.\n")

      - name: Run portability contract
        shell: Rscript {0}
        run: |
          source(file.path("tests", "portability.R"))

      - name: Write platform summary
        shell: Rscript {0}
        run: |
          txt <- c(
            "Cross-platform portability QA: PASS",
            paste0("OS: ", Sys.info()[["sysname"]]),
            paste0("R: ", R.version.string),
            "R script parse: PASS",
            "tests/portability.R: PASS"
          )
          writeLines(txt, "PORTABILITY_QA.txt")

      - name: Upload platform summary
        uses: actions/upload-artifact@v4
        with:
          name: portability-${{ matrix.os }}-${{ github.sha }}
          retention-days: 30
          path: PORTABILITY_QA.txt
