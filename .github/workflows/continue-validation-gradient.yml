name: Validation gradient continuation

on:
  push:
    branches:
      - baseline-no-structures
    paths:
      - "R/**"
      - "tests/**"
      - ".github/workflows/test-natural-reference.yml"
      - ".github/workflows/continue-validation-gradient.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  wait-natural-then-transfer:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve NATURAL source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          if [ "${#changed[@]}" -eq 1 ] && [ "${changed[0]}" = ".github/workflows/continue-validation-gradient.yml" ]; then
            target_sha="$(git rev-parse "$GITHUB_SHA^")"
          else
            target_sha="$GITHUB_SHA"
          fi
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "Will continue after NATURAL succeeds for $target_sha"

      - name: Wait for matching NATURAL validation
        id: wait_natural
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.source.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/test-natural-reference.yml/runs?branch=baseline-no-structures&per_page=50"
          for attempt in $(seq 1 240); do
            json="$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api")"
            row="$(jq -c --arg sha "$TARGET_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.run_number) | reverse | .[0] // empty' \
              <<<"$json")"

            if [ -z "$row" ]; then
              echo "NATURAL run for $TARGET_SHA not visible yet; retry $attempt/240"
              sleep 60
              continue
            fi

            run_id="$(jq -r '.id' <<<"$row")"
            status="$(jq -r '.status' <<<"$row")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$row")"
            echo "NATURAL run $run_id: status=$status conclusion=$conclusion"

            if [ "$status" = "completed" ]; then
              echo "natural_run_id=$run_id" >> "$GITHUB_OUTPUT"
              if [ "$conclusion" != "success" ]; then
                echo "NATURAL did not pass; LOW/MODERATE are correctly blocked." >&2
                exit 1
              fi
              exit 0
            fi
            sleep 60
          done
          echo "Timed out waiting for NATURAL validation." >&2
          exit 1

      - name: Dispatch LOW and MODERATE validation in parallel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          dispatch_if_needed() {
            workflow="$1"
            label="$2"
            api="repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=baseline-no-structures&per_page=30"
            json="$(gh api "$api")"

            existing="$(jq -c --arg sha "$GITHUB_SHA" '
              [.workflow_runs[]
               | select(.head_sha == $sha)
               | select(.status != "completed" or .conclusion == "success")]
              | sort_by(.run_number)
              | reverse
              | .[0] // empty
            ' <<<"$json")"

            if [ -n "$existing" ]; then
              id="$(jq -r '.id' <<<"$existing")"
              status="$(jq -r '.status' <<<"$existing")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$existing")"
              echo "$label already covered for $GITHUB_SHA: run=$id status=$status conclusion=$conclusion"
              return 0
            fi

            echo "Dispatching $label for branch baseline-no-structures"
            gh workflow run "$workflow" --ref baseline-no-structures
          }

          dispatch_if_needed "test-low-transfer.yml" "LOW"
          dispatch_if_needed "test-moderate-transfer.yml" "MODERATE"

          echo "LOW and MODERATE are now independent GitHub Actions workflows and may run concurrently."
