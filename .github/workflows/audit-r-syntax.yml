name: R script syntax audit

on:
  push:
    branches:
      - baseline-no-structures
    paths:
      - "R/**"
      - "tests/**"
      - ".github/workflows/audit-r-syntax.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"

      - name: Parse all project R scripts
        shell: bash
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          files <- sort(unique(c(
            list.files("R", pattern = "\\.R$", recursive = TRUE, full.names = TRUE),
            list.files("tests", pattern = "\\.R$", recursive = TRUE, full.names = TRUE)
          )))
          stopifnot(length(files) > 0)
          failed <- character()
          for (f in files) {
            cat("Parsing:", f, "\n")
            ok <- tryCatch({
              parse(file = f)
              TRUE
            }, error = function(e) {
              message("PARSE ERROR in ", f, ": ", conditionMessage(e))
              FALSE
            })
            if (!ok) failed <- c(failed, f)
          }
          if (length(failed)) {
            stop("R syntax audit failed: ", paste(failed, collapse = ", "))
          }
          cat("Parsed", length(files), "R scripts successfully.\n")
          RS

      - name: Verify critical hydrology stages are wired
        shell: bash
        run: |
          set -euo pipefail
          test -f R/02_build_baseline_hydrology.R
          test -f R/02A_whitebox_fill_retry.R
          test -f R/02D8_final_spill_evidence.R
          test -f R/02E_water_connected_candidates.R
          grep -Fq 'source(file.path(PROJECT_ROOT, "R", "02A_whitebox_fill_retry.R"))' R/02_build_baseline_hydrology.R
          grep -Fq 'source(file.path("R", "02D8_final_spill_evidence.R"))' R/02D7K_non_target_raised_link_resolution.R
          grep -Fq '02D.8 HARD QA: PASS' R/02D8_final_spill_evidence.R
          grep -Fq 'source(file.path("R", "02E_water_connected_candidates.R"))' R/02_build_baseline_hydrology.R
          grep -Fq '02E HARD QA: PASS' R/02_build_baseline_hydrology.R
          grep -Fq '02E CANDIDATE MASK QA: PASS' R/02_build_baseline_hydrology.R

      - name: Test bounded Whitebox fill retry
        run: Rscript tests/whitebox_fill_retry.R

      - name: Test outlet-independent candidate contract
        run: Rscript tests/water_connected_candidates.R

      - name: Write syntax audit summary
        shell: bash
        run: |
          cat > R_SYNTAX_AUDIT.txt <<'EOF'
          R script syntax audit: PASS
          All R/ and tests/ .R files parse successfully.
          Critical 02D.8 evidence and 02E candidate-mask QA wiring: PASS
          EOF

      - name: Upload audit summary
        uses: actions/upload-artifact@v4
        with:
          name: r-script-syntax-audit-${{ github.sha }}
          retention-days: 30
          path: R_SYNTAX_AUDIT.txt
