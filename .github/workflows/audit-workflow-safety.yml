name: Workflow safety audit

on:
  push:
    branches:
      - baseline-no-structures
    paths:
      - ".github/workflows/audit-workflow-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-safety:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify baseline branch safety contracts
        shell: bash
        run: |
          set -euo pipefail

          files=(.github/workflows/*.yml .github/workflows/*.yaml)

          # NATIONAL must remain locked: CI may mention the word in comments
          # or audit text, but it must not execute hydrology with NATIONAL mode.
          if find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) \
              ! -name 'audit-workflow-safety.yml' -print0 \
              | xargs -0 grep -nHE 'HYDRO_MODE[[:space:]]*[:=][[:space:]]*["'\'' ]*NATIONAL'; then
            echo "A workflow attempts to run HYDRO_MODE=NATIONAL before the national gate." >&2
            exit 1
          fi

          # No workflow in this development branch may automatically merge or
          # push the hydrology work into main.
          if find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) \
              ! -name 'audit-workflow-safety.yml' -print0 \
              | xargs -0 grep -nHE 'git[[:space:]]+push([^#\n]*[[:space:]])main([[:space:]]|$)|gh[[:space:]]+pr[[:space:]]+merge'; then
            echo "Automatic main push/merge command detected." >&2
            exit 1
          fi

          # The validation workflows must remain scoped to the development
          # branch rather than treating main as the active validation branch.
          test -f .github/workflows/test-natural-reference.yml
          test -f .github/workflows/test-low-transfer.yml
          test -f .github/workflows/test-moderate-transfer.yml
          grep -Fq 'baseline-no-structures' .github/workflows/test-natural-reference.yml
          grep -Fq 'baseline-no-structures' .github/workflows/test-low-transfer.yml
          grep -Fq 'baseline-no-structures' .github/workflows/test-moderate-transfer.yml

          cat > WORKFLOW_SAFETY_AUDIT.txt <<'EOF'
          Workflow safety audit: PASS
          No HYDRO_MODE=NATIONAL execution detected.
          No automatic push-to-main or PR-merge command detected.
          NATURAL, LOW and MODERATE workflows remain scoped to baseline-no-structures.
          EOF

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: workflow-safety-audit-${{ github.sha }}
          retention-days: 30
          path: WORKFLOW_SAFETY_AUDIT.txt
