name: Verify LOW coastline context

on:
  push:
    branches:
      - baseline-no-structures
    paths:
      - ".github/workflows/verify-low-coastline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-coastline:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Query NLS Finland hydrography at LOW nonfinite boundary
        shell: python
        run: |
          import json, math, urllib.parse, urllib.request

          # First sampled nonfinite receiver from LOW 02D.5 diagnostic.
          lat0 = 62.16488417998065
          lon0 = 21.216456092353763

          # Published Kristiinankaupunki guest-harbour coordinate, used only
          # as a control that the NLS shoreline query returns local features.
          ctrl_lat = 62.271666667
          ctrl_lon = 21.383333333

          base = "https://avoin-paikkatieto.maanmittauslaitos.fi/inspire-hydrography/features/v1/collections"

          def get(collection, lat, lon, pad):
              bbox = f"{lon-pad},{lat-pad},{lon+pad},{lat+pad}"
              url = f"{base}/{collection}/items?" + urllib.parse.urlencode({
                  "bbox": bbox,
                  "limit": 100,
                  "f": "json",
              })
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/geo+json, application/json",
                      "User-Agent": "MaaltaMerelle-validation/1.0",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def xy_m(coord):
              lon, lat = coord[:2]
              x = (lon - lon0) * 111320.0 * math.cos(math.radians(lat0))
              y = (lat - lat0) * 111320.0
              return x, y

          def closest_on_segment(a, b):
              ax, ay = a
              bx, by = b
              dx, dy = bx - ax, by - ay
              if dx == 0 and dy == 0:
                  t = 0.0
              else:
                  t = max(0.0, min(1.0, (-(ax)*dx + -(ay)*dy) / (dx*dx + dy*dy)))
              qx, qy = ax + t*dx, ay + t*dy
              return math.hypot(qx, qy), qx, qy

          def lines(geom):
              if not geom:
                  return
              typ = geom.get("type")
              c = geom.get("coordinates")
              if typ == "LineString":
                  yield c
              elif typ == "MultiLineString":
                  yield from c
              elif typ == "GeometryCollection":
                  for g in geom.get("geometries", []):
                      yield from lines(g)

          ctrl = get("landwaterboundary", ctrl_lat, ctrl_lon, 0.01)
          print(f"NLS_CONTROL_HARBOUR_BOUNDARIES={len(ctrl.get('features', []))}")

          coast = None
          used_pad = None
          for pad in (0.06, 0.10, 0.15, 0.20, 0.25):
              z = get("landwaterboundary", lat0, lon0, pad)
              print(f"NLS_PROBLEM_BOUNDARIES_PAD_{pad:.2f}={len(z.get('features', []))}")
              if z.get("features"):
                  coast = z
                  used_pad = pad
                  break

          standing = get("standingwater", lat0, lon0, 0.01)
          courses = get("watercourse", lat0, lon0, 0.01)

          print("LOW_PROBLEM_EPSG3067=199001,6905999")
          print(f"LOW_PROBLEM_CRS84={lat0:.9f},{lon0:.9f}")
          print(f"NLS_STANDINGWATER_FEATURES_~1KM={len(standing.get('features', []))}")
          print(f"NLS_WATERCOURSE_FEATURES_~1KM={len(courses.get('features', []))}")

          if coast is None:
              raise SystemExit("No NLS land-water boundary found in expanding search")

          closest = None
          for feat in coast.get("features", []):
              for line in lines(feat.get("geometry")):
                  m = [xy_m(c) for c in line]
                  for a, b in zip(m, m[1:]):
                      d, qx, qy = closest_on_segment(a, b)
                      if closest is None or d < closest[0]:
                          qlon = lon0 + qx / (111320.0 * math.cos(math.radians(lat0)))
                          qlat = lat0 + qy / 111320.0
                          closest = (d, qlat, qlon, feat.get("properties", {}))

          if closest is None:
              raise SystemExit("NLS shoreline features returned without usable line geometry")

          print(f"NLS_FIRST_NONEMPTY_SEARCH_PAD_DEG={used_pad:.2f}")
          print(f"NLS_NEAREST_LANDWATERBOUNDARY_M={closest[0]:.3f}")
          print(f"NLS_CLOSEST_BOUNDARY_CRS84={closest[1]:.9f},{closest[2]:.9f}")
          print(f"NLS_CLOSEST_BOUNDARY_EAST_OF_POINT={closest[2] > lon0}")
          print("NLS_CLOSEST_BOUNDARY_PROPERTIES=" +
                json.dumps(closest[3], ensure_ascii=False, sort_keys=True))
