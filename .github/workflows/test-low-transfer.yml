name: LOW transfer hydrology QA

# runner retry marker: external exit-143 recovery

on:
  push:
    branches:
      - baseline-no-structures
    paths:
      - ".github/workflows/test-low-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  low-transfer:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      HYDRO_MODE: LOCAL_TEST
      HYDRO_PROJECT_ROOT: ${{ github.workspace }}
      HYDRO_TEST_ID: E200000_N6900000
      HYDRO_TEST_EXTENT: 199000,211000,6899000,6911000
      HYDRO_EXPECTED_LAKES: "24"
      HYDRO_EXPECTED_RIVER_AREAS: "5"
      HYDRO_EXPECTED_RIVER_LINES: "30"
      HYDRO_SOURCE_TEST_ROOT: ${{ github.workspace }}/data/E200000_N6900000
      HYDRO_RUN_ROOT: ${{ github.workspace }}/runs/E200000_N6900000
      R_WHITEBOX_EXE_PATH: ${{ github.workspace }}/fixtures/ci/whitebox/whitebox_tools
      VALIDATION_SOURCE_GPKG: ${{ github.workspace }}/fixtures/ci/VALIDATION_GRADIENT/LOW_E200000_N6900000/VALIDATION_INPUTS_E200000_N6900000_12km.gpkg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout validation fixtures
        uses: actions/checkout@v4
        with:
          ref: ci-testdata-validation-gradient
          path: fixtures

      - name: Verify fixture and reconstruct LOW DEM
        shell: bash
        run: |
          set -euo pipefail
          root="fixtures/ci/VALIDATION_GRADIENT"
          src="$root/LOW_E200000_N6900000"
          dst="data/E200000_N6900000"

          cd "$root"
          grep -E '(LOW_E200000_N6900000/.*\.gpkg|LOW_E200000_N6900000/.*\.part[0-9]+)$' MANIFEST.sha256 | sha256sum -c -
          cd "$GITHUB_WORKSPACE"

          mkdir -p "$dst"
          mapfile -t parts < <(find "$src" -maxdepth 1 -type f -name 'dem_12km_rumpukorjattu.tif.part*' | sort)
          test "${#parts[@]}" -eq 2
          cat "${parts[@]}" > "$dst/dem_12km_rumpukorjattu.tif"

          expected_size="$(grep '^original_size_bytes=' "$src/DEM_RECONSTRUCTION.txt" | cut -d= -f2)"
          expected_sha="$(grep '^original_sha256=' "$src/DEM_RECONSTRUCTION.txt" | cut -d= -f2)"
          test "$(stat -c%s "$dst/dem_12km_rumpukorjattu.tif")" = "$expected_size"
          echo "$expected_sha  $dst/dem_12km_rumpukorjattu.tif" | sha256sum -c -

          chmod +x "$R_WHITEBOX_EXE_PATH"
          test -x "$R_WHITEBOX_EXE_PATH"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::terra@1.8-29
            any::whitebox@2.4.3
            any::sf

      - name: Run portability tests
        run: Rscript tests/portability.R

      - name: Build canonical LOW inputs
        run: Rscript R/00A_prepare_validation_fixture.R 2>&1 | tee low00a.log

      - name: Run input preparation
        run: Rscript R/01_prepare_hydrology_inputs.R 2>&1 | tee low01.log

      - name: Run LOW diagnostics through 02D.8
        shell: bash
        run: |
          set -euo pipefail
          Rscript R/02_build_baseline_hydrology.R 2>&1 | tee low02.log
          test "$(grep -Fxc '02D.8 HARD QA: PASS' low02.log || true)" -eq 1

      - name: Upload LOW QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LOW-E200000-N6900000-QA-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            low00a.log
            low01.log
            low02.log
            data/E200000_N6900000/00A_validation_fixture_QA.csv
            runs/E200000_N6900000/01_inputs/*.csv
            runs/E200000_N6900000/02_baseline/*.csv
