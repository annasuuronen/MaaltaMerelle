name: Roihu MODERATE Slurm batch contract (offline, manual)

# Manual-only: existing CSC preflight explicitly forbids new PR-triggered workflows.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Check static syntax and fail-closed batch contract
        run: |
          bash -n scripts/roihu_moderate_bounded_batch.sbatch
          python3 -I -B tests/test_roihu_moderate_batch_contract.py
      - name: Confirm no CSC job submitted
        run: echo 'PASS - static offline tests only; no Slurm allocation or real hydrology data'
