name: R source dependency audit

# domain-exit source audit marker

on:
  push:
    branches:
      - baseline-no-structures
    paths:
      - ".github/workflows/audit-r-source-graph.yml"
      - "R/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-graph:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"

      - name: Audit source dependencies
        shell: bash
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          files <- sort(list.files("R", pattern = "\\.R$", recursive = TRUE, full.names = TRUE))
          stopifnot(length(files) > 0)

          calls <- data.frame(
            caller = character(),
            target = character(),
            stringsAsFactors = FALSE
          )

          for (f in files) {
            txt <- readLines(f, warn = FALSE, encoding = "UTF-8")
            hit <- grep('source\\(file\\.path\\("R",\\s*"[^"]+"\\)\\)', txt, value = TRUE)
            if (!length(hit)) next

            targets <- sub(
              '.*source\\(file\\.path\\("R",\\s*"([^"]+)"\\)\\).*',
              'R/\\1',
              hit
            )

            calls <- rbind(
              calls,
              data.frame(caller = f, target = targets, stringsAsFactors = FALSE)
            )
          }

          if (nrow(calls) == 0) {
            stop("No R source(file.path('R', ...)) dependencies found")
          }

          missing <- unique(calls$target[!file.exists(calls$target)])
          if (length(missing)) {
            stop("Missing sourced R files: ", paste(missing, collapse = ", "))
          }

          # Build the directed source graph and fail on recursive source cycles.
          nodes <- unique(c(calls$caller, calls$target))
          adj <- split(calls$target, calls$caller)
          state <- setNames(integer(length(nodes)), nodes)
          stack <- character()

          visit <- function(n) {
            if (state[[n]] == 2L) return(invisible(NULL))
            if (state[[n]] == 1L) {
              stop("Recursive source cycle detected: ", paste(c(stack, n), collapse = " -> "))
            }
            state[[n]] <<- 1L
            stack <<- c(stack, n)
            for (m in unique(adj[[n]] %||% character())) visit(m)
            stack <<- head(stack, -1L)
            state[[n]] <<- 2L
            invisible(NULL)
          }

          `%||%` <- function(x, y) if (is.null(x)) y else x
          for (n in nodes) visit(n)

          # Required diagnostic chain endpoints.
          stopifnot(any(calls$target == "R/02D8_final_spill_evidence.R"))
          stopifnot(any(calls$target == "R/02E_water_connected_candidates.R"))

          write.csv(calls, "R_SOURCE_GRAPH.csv", row.names = FALSE)
          cat("R source dependency audit: PASS\n")
          cat("Source calls:", nrow(calls), "\n")
          cat("Distinct sourced files:", length(unique(calls$target)), "\n")
          RS

      - name: Write summary
        shell: bash
        run: |
          {
            echo "R source dependency audit: PASS"
            echo "All statically resolved R source targets exist."
            echo "No recursive source cycles detected."
            echo "02D.8 final evidence and 02E candidate stages are connected."
          } > R_SOURCE_GRAPH_AUDIT.txt

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: r-source-dependency-audit-${{ github.sha }}
          retention-days: 30
          path: |
            R_SOURCE_GRAPH.csv
            R_SOURCE_GRAPH_AUDIT.txt
