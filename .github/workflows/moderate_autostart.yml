name: MODERATE automated diagnostic validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/moderate_autostart.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["CSC preflight"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: moderate-automated-validation-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'codex/moderate-02d4-diagnosis' &&
       github.event.workflow_run.head_repository.full_name == 'annasuuronen/MaaltaMerelle')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: annasuuronen/MaaltaMerelle
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '89f43d84d1a51d226e9574f47a8bb45e4ee0b677' }}
          persist-credentials: false
      - name: Verify exact reviewed commit and script syntax
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '89f43d84d1a51d226e9574f47a8bb45e4ee0b677' }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -s scripts/audit_moderate_spill_d8_readonly.R
          test -s scripts/audit_moderate_lake_geometry_readonly.R
          test -s tests/moderate_roihu_review_smoke.R
          test -s tests/spill_storage_semantics.R
          bash -n scripts/roihu_moderate_validation.sbatch
          bash -n scripts/roihu_launch_moderate_review.sh

  synthetic:
    name: "Synthetic: ${{ matrix.suite }}"
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - suite: d8_geometry
            script: tests/moderate_roihu_review_smoke.R
          - suite: spill_storage
            script: tests/spill_storage_semantics.R
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: annasuuronen/MaaltaMerelle
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '89f43d84d1a51d226e9574f47a8bb45e4ee0b677' }}
          persist-credentials: false
      - name: Install R spatial system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgdal-dev libproj-dev libgeos-dev libudunits2-dev
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("terra", "whitebox"), repos="https://cloud.r-project.org")
      - name: Run independent synthetic test suite
        env:
          TEST_SCRIPT: ${{ matrix.script }}
        shell: bash
        run: |
          set -o pipefail
          Rscript --vanilla "$TEST_SCRIPT" 2>&1 | tee test.log
      - name: Confirm no CSC data access
        if: always()
        run: |
          test ! -e "/scratch/project_2004707"
          echo "SYNTHETIC_ONLY=true"
          echo "MODERATE=REVIEW_REQUIRED"
          echo "NATIONAL=LOCKED"
      - name: Retain suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moderate-${{ matrix.suite }}-logs
          path: test.log
          if-no-files-found: warn
          retention-days: 30

  summary:
    name: Combined gate (no hydrological approval)
    needs: [preflight, synthetic]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any required job failed, skipped or was cancelled
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          SYNTHETIC: ${{ needs.synthetic.result }}
        run: |
          echo "PREFLIGHT=$PREFLIGHT"
          echo "INDEPENDENT_SYNTHETIC_SUITES=$SYNTHETIC"
          echo "MODERATE=REVIEW_REQUIRED"
          echo "NATIONAL=LOCKED"
          if [[ "$PREFLIGHT" != success || "$SYNTHETIC" != success ]]; then
            echo "::error::One or more required tests did not pass"
            exit 1
          fi
          echo "GITHUB_SYNTHETIC_PASS=true"
          echo "ROIHU_REAL_DATA_VALIDATED=false"
